services:
  - type: web
    name: neon-tetris-api
    runtime: node
    rootDir: server
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_COIN_POUCH
        sync: false
      - key: STRIPE_PRICE_MEGA_VAULT
        sync: false
      - key: STRIPE_PRICE_ELITE_THEME
        sync: false
      - key: CHECKOUT_SUCCESS_URL
        sync: false
      - key: CHECKOUT_CANCEL_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false

  - type: web
    name: neon-tetris-web
    runtime: static
    buildCommand: >-
      mkdir -p public && cp index.html public/index.html &&
      sed -i "s|https://your-tetris-server.com|https://${BACKEND_HOST}|g;
      s|wss://your-tetris-server.com|wss://${BACKEND_HOST}|g" public/index.html
    staticPublishPath: public
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: BACKEND_HOST
        fromService:
          type: web
          name: neon-tetris-api
          property: host
      - key: BACKEND_URL
        fromService:
          type: web
          name: neon-tetris-api
          property: host
